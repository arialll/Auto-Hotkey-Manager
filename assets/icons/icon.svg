<svg id="svg-concept-2" viewBox="0 0 200 200" class="w-full h-full max-w-[220px] max-h-[220px]" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="grad2_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#00F2FE"></stop>
                                    <stop offset="100%" stop-color="#4FACFE"></stop>
                                </linearGradient>
                                <linearGradient id="grad2_pink" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FF0844"></stop>
                                    <stop offset="100%" stop-color="#FFB199"></stop>
                                </linearGradient>
                                <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="3" result="blur1"></feGaussianBlur>
                                    <feGaussianBlur stdDeviation="6" result="blur2"></feGaussianBlur>
                                    <feMerge>
                                        <feMergeNode in="blur2"></feMergeNode>
                                        <feMergeNode in="blur1"></feMergeNode>
                                        <feMergeNode in="SourceGraphic"></feMergeNode>
                                    </feMerge>
                                </filter>
                            </defs>
                            
                            <!-- Hexagonal Border Container -->
                            <polygon points="100,12 175,55 175,145 100,188 25,145 25,55" fill="#0D131F" stroke="#1E293B" stroke-width="4"></polygon>
                            
                            <!-- Outer Circuit Accents -->
                            <polygon points="100,20 167,58 167,142 100,180 33,142 33,58" fill="none" stroke="url(#grad2_cyan)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"></polygon>

                            <!-- Letter "A" Monogram Circuit -->
                            <path d="M 60 140 L 95 50 C 97 45, 103 45, 105 50 L 140 140" fill="none" stroke="url(#grad2_cyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"></path>
                            
                            <!-- Letter "H" Crossbar & Script Arrow Connector -->
                            <path d="M 45 100 L 155 100" fill="none" stroke="url(#grad2_pink)" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow)"></path>
                            
                            <!-- Code Execution Node Points -->
                            <circle cx="100" cy="50" r="5" fill="#FFFFFF"></circle>
                            <circle cx="75" cy="100" r="5" fill="#FFFFFF"></circle>
                            <circle cx="125" cy="100" r="5" fill="#FFFFFF"></circle>
                            <circle cx="60" cy="140" r="4" fill="url(#grad2_cyan)"></circle>
                            <circle cx="140" cy="140" r="4" fill="url(#grad2_cyan)"></circle>
                        </svg>